; Worker de file d'attente — shoprelle.com
; Installer via `make install-supervisor`.
;
; Ce qu'il traite : les notifications d'achat. `PurchaseRequestSubmitted` et
; `PurchaseRequestStatusChanged` implémentent toutes deux ShouldQueue sur la
; file `database` — sans ce worker, aucune ne part jamais, et la demande est
; enregistrée sans que personne n'en soit averti.
;
; Un seul process au lancement : le volume est celui d'un service qui ouvre,
; et deux workers sur SQLite se disputent le verrou d'écriture plus qu'ils ne
; se partagent le travail. Monter `numprocs` quand la file commence à traîner,
; ce que `php artisan queue:monitor database` sait dire.
;
; `--max-time=3600` recycle le process toutes les heures : un worker de longue
; durée garde en mémoire l'état de l'application tel qu'il était à son
; démarrage, fuites de mémoire comprises.

[program:shoprelle-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/shoprelle.com/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/shoprelle.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/shoprelle.com/storage/logs/worker.log
; Laisse au job en cours le temps de finir avant que Supervisor ne le tue —
; un `make deploy` redémarre ce worker, et couper un envoi en vol perdrait la
; notification sans la remettre en file.
stopwaitsecs=3600
